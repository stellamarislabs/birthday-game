<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Maria and the Case of the Missing Heart - a warm legal mystery platformer birthday gift."
    />
    <meta name="theme-color" content="#11182a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Missing Heart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Maria and the Case of the Missing Heart</title>
  </head>
  <body>
    <main id="game-shell" aria-label="Maria and the Case of the Missing Heart">
      <div id="scene-status" class="sr-only" aria-live="polite"></div>
      <div id="game-frame">
        <div id="game-container" aria-label="Game canvas"></div>
      </div>
      <aside id="rotate-overlay" aria-live="polite">
        <div>
          <p class="rotate-kicker">Landscape first</p>
          <p>Please rotate your device to open the case comfortably.</p>
          <div class="rotate-pwa-guidance" data-testid="rotate-pwa-guidance" aria-label="Home Screen install guidance">
            <p class="rotate-pwa-title">Best full-screen experience</p>
            <p>For the smoothest full-screen experience, add this case to your Home Screen.</p>
            <div class="rotate-pwa-steps">
              <span>Chrome: tap ⋮ → Add to Home screen</span>
              <span>Safari: tap Share → Add to Home Screen</span>
            </div>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
